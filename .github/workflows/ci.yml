# Rename the branches below if this project does not use develop/main. Every pull request runs
# the whole set: there is deliberately no paths-ignore fast path, because a skipped required
# check reports as "not run", which reads as "not blocking", and a change misfiled as
# documentation would ship unverified.
name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Read app settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          config = {}
          for line in Path(".kaysalt/project.conf").read_text(encoding="utf-8").splitlines():
              key, separator, value = line.partition("=")
              if separator:
                  config[key.strip()] = value.strip()

          locale_keys = [
              "LOCALE_COUNTRY",
              "LOCALE_TIME_ZONE",
              "LOCALE_CURRENCY",
              "LOCALE_DATE_FORMAT",
              "LOCALE_LANGUAGE",
          ]
          locale_keys.extend(key for key in config if key.startswith("LOCALE_") and key not in locale_keys)
          blank_locale = [key for key in locale_keys if not config.get(key, "").strip()]
          if blank_locale:
              print(
                  "::error::Blank Locale values in .kaysalt/project.conf: "
                  + ", ".join(blank_locale)
              )
              sys.exit(1)

          blank_settings = [key for key in ("APP_NAME", "TEST_SITE") if not config.get(key, "").strip()]
          if blank_settings:
              print(
                  "::error::Blank required values in .kaysalt/project.conf: "
                  + ", ".join(blank_settings)
              )
              sys.exit(1)

          env_keys = ["APP_NAME", "TEST_SITE", "SAMPLE_DATA_SEED", *locale_keys]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key in env_keys:
                  env.write(f"{key}={config.get(key, '')}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench

      - name: Install and build test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app "$APP_NAME" "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          python3 - "$APP_NAME" <<'PY'
          from pathlib import Path
          import sys

          config_path = Path("apps") / sys.argv[1] / ".kaysalt/project.conf"
          config = config_path.read_text(encoding="utf-8").splitlines()
          updates = {"BENCH_ROOT": "../..", "BENCH_EXEC": "", "TEST_SITE_BUILD": ""}
          found = set()
          for index, line in enumerate(config):
              key, separator, _ = line.partition("=")
              if separator and key in updates:
                  config[index] = f"{key}={updates[key]}"
                  found.add(key)
          missing = updates.keys() - found
          if missing:
              raise SystemExit(f"Missing settings in {config_path}: {', '.join(sorted(missing))}")
          config_path.write_text("\n".join(config) + "\n", encoding="utf-8")
          PY
          cd "apps/$APP_NAME"
          KAYSALT_DB_ROOT_PASSWORD=root KAYSALT_TEST_ADMIN_PASSWORD=admin-test scripts/rebuild-test-site.sh
        env:
          CI: 'Yes'

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: bench --site "$TEST_SITE" run-tests --app "$APP_NAME"
        env:
          TYPE: server

  ui:
    runs-on: ubuntu-latest
    name: UI

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Read app settings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          config = {}
          for line in Path(".kaysalt/project.conf").read_text(encoding="utf-8").splitlines():
              key, separator, value = line.partition("=")
              if separator:
                  config[key.strip()] = value.strip()

          locale_keys = [
              "LOCALE_COUNTRY",
              "LOCALE_TIME_ZONE",
              "LOCALE_CURRENCY",
              "LOCALE_DATE_FORMAT",
              "LOCALE_LANGUAGE",
          ]
          locale_keys.extend(key for key in config if key.startswith("LOCALE_") and key not in locale_keys)
          blank_locale = [key for key in locale_keys if not config.get(key, "").strip()]
          if blank_locale:
              print(
                  "::error::Blank Locale values in .kaysalt/project.conf: "
                  + ", ".join(blank_locale)
              )
              sys.exit(1)

          blank_settings = [key for key in ("APP_NAME", "TEST_SITE") if not config.get(key, "").strip()]
          if blank_settings:
              print(
                  "::error::Blank required values in .kaysalt/project.conf: "
                  + ", ".join(blank_settings)
              )
              sys.exit(1)

          env_keys = ["APP_NAME", "TEST_SITE", "SAMPLE_DATA_SEED", *locale_keys]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key in env_keys:
                  env.write(f"{key}={config.get(key, '')}\n")
          PY

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Install MariaDB Client
        run: |
          sudo apt update
          sudo apt-get install mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" ~/frappe-bench

      - name: Install and build test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app "$APP_NAME" "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench build
          python3 - "$APP_NAME" <<'PY'
          from pathlib import Path
          import sys

          config_path = Path("apps") / sys.argv[1] / ".kaysalt/project.conf"
          config = config_path.read_text(encoding="utf-8").splitlines()
          updates = {"BENCH_ROOT": "../..", "BENCH_EXEC": "", "TEST_SITE_BUILD": ""}
          found = set()
          for index, line in enumerate(config):
              key, separator, _ = line.partition("=")
              if separator and key in updates:
                  config[index] = f"{key}={updates[key]}"
                  found.add(key)
          missing = updates.keys() - found
          if missing:
              raise SystemExit(f"Missing settings in {config_path}: {', '.join(sorted(missing))}")
          config_path.write_text("\n".join(config) + "\n", encoding="utf-8")
          PY
          cd "apps/$APP_NAME"
          KAYSALT_DB_ROOT_PASSWORD=root KAYSALT_TEST_ADMIN_PASSWORD=admin-test scripts/rebuild-test-site.sh
        env:
          CI: 'Yes'

      - name: Serve the site
        working-directory: /home/runner/frappe-bench
        run: |
          echo "127.0.0.1 $TEST_SITE" | sudo tee -a /etc/hosts
          nohup bench serve --port 8000 > /home/runner/bench-serve.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf "http://$TEST_SITE:8000/api/method/ping" && break
            sleep 2
          done
          curl -sf "http://$TEST_SITE:8000/api/method/ping"

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run UI regression suite
        run: npx playwright test
        env:
          BASE_URL: http://${{ env.TEST_SITE }}:8000
          PC_SID_CMD: cd /home/runner/frappe-bench && BROWSER=echo bench browse "$TEST_SITE" --user "$PC_USER"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload bench log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-serve-log
          path: /home/runner/bench-serve.log
